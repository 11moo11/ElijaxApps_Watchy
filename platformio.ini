; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ 6.9.0
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
board_build.hwids = 10C4, EA60
platform_packages =
    framework-arduinoespressif32 @ ~3.20017.0
lib_deps =
    Adafruit GFX Library
    Adafruit BusIO
    ESP_DoubleResetDetector
    Arduino_JSON
    ESP32 BLE Arduino
    DS3232RTC
    NTPClient
    Wire
    elpaso/Rtc_Pcf8563
    GxEPD2
    tzapu/WiFiManager@^2.0.17
    ESP32Ping
    ricmoo/QRCode@^0.0.1
    buelowp/sunset@^1.1.7
    https://github.com/signetica/MoonPhase
    https://github.com/signetica/MoonRise
    https://github.com/signetica/SunRise
    ESPmDNS
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    gurusr/SmallRTC
    https://github.com/GuruSR/SmallNTP.git
    https://github.com/GuruSR/Olson2POSIX.git
    
build_type = release
build_unflags =
    -O0
    -Og
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_WATCHY_V20
    -DWATCHY_WRAPPER_INCLUDE=1
build_src_filter = +<*> -<os/WatchfaceDrawWatchyGSR.cpp>
extra_scripts = pre:scripts/prune_watchfaces.py

monitor_speed = 115200